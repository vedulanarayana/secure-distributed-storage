repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args:
          [
            --ignore-missing-imports,
            client,
            metadata_service,
            storage_node,
            anomaly,
            scripts,
          ]
        pass_filenames: false
        files: ^(client|metadata_service|storage_node|anomaly|scripts)/
