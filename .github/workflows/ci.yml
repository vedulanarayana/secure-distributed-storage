name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.4 mypy==2.3.1 black==26.3.1 pytest-cov==5.0.0

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy --ignore-missing-imports client metadata_service storage_node anomaly scripts

      - name: Test (pytest)
        run: pytest -q --cov=client --cov=metadata_service --cov=storage_node --cov=anomaly --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build metadata_service image
        run: docker build -f docker/metadata_service.Dockerfile -t metadata_service:ci .

      - name: Build storage_node image
        run: docker build -f docker/storage_node.Dockerfile -t storage_node:ci .
